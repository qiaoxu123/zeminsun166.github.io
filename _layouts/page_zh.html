<!doctype html>
<html lang="zh-CN" class="no-js">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>孙泽敏</title>
    <meta name="description" content="孙泽敏（Zemin Sun），吉林大学计算机科学与技术学院准聘副教授、博士生导师，研究方向包括移动边缘计算、无人机通信与网络、生成式人工智能和深度强化学习。">
    <link rel="canonical" href="https://zeminsun166.github.io/">
    <meta name="robots" content="index, follow">
    <link rel="alternate" hreflang="zh-CN" href="https://zeminsun166.github.io/">
    <link rel="alternate" hreflang="en" href="https://zeminsun166.github.io/en/about/">
    <link rel="alternate" hreflang="x-default" href="https://zeminsun166.github.io/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Zemin Sun",
      "alternateName": "孙泽敏",
      "url": "https://zeminsun166.github.io/",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "Jilin University"
      },
      "sameAs": [
        "https://scholar.google.com/citations?user=TJtQW8gAAAAJ",
        "https://github.com/zeminsun166"
      ]
    }
    </script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Base URL for assets -->
    <base href="{{ site.baseurl | default: '' }}/">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/favicon-16x16.png' | relative_url }}">
  </head>

  <body>
    <!-- Navigation -->
    {% include masthead.html %}

    <div id="main" role="main">
      <!-- Sidebar -->
      {% include sidebar.html %}
    
      <!-- Main Content -->
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <!-- Scripts -->
    <script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/language-switcher.js' | relative_url }}"></script>
    
    <!-- Analytics -->
    {% include analytics.html %}
    {% include fetch_google_scholar_stats.html %}
  </body>
</html>
